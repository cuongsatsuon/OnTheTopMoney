# nginx BÊN TRONG container `web` (image ottm-web, deploy/Dockerfile.web) — KHÔNG phải nginx của máy chủ.
# Chỉ phục vụ web/dist ở cổng 8080 (compose publish 127.0.0.1:${WEB_HOST_PORT:-3080}); nginx máy chủ
# (deploy/nginx.conf.example) chuyển `/` tới đây và giữ TLS, header bảo mật (CSP, HSTS…) và api.
#
# Container quyết Cache-Control cho file web — đúng một header mỗi response (nginx máy chủ không thêm cái thứ hai khi
# đã có): /assets/* có → immutable 1 năm; còn lại (index.html, SPA fallback) → no-cache; 404 → no-store.
# /assets/ thiếu file → 404 text/plain, không bao giờ rơi về index.html.
#
# Chạy với user không phải root (101) và root FS chỉ đọc: mọi chỗ nginx ghi (pid, thư mục tạm) nằm ở /tmp (tmpfs).

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # nginx máy chủ đã ghi access log cho mọi request; ở đây chỉ giữ error log (docker logs web).
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Chuyển hướng (nếu có) dùng đường tương đối: không lộ cổng 8080/host nội bộ ra trình duyệt.
    absolute_redirect off;

    # Nén ở đây (nginx máy chủ tắt gzip trên site và chuyển nguyên body).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 404 dạng chữ, không cache, không phải HTML (asset thiếu không trả trang HTML với MIME sai).
        error_page 404 = @not_found;

        # Healthcheck của container (và kiểm tay: curl 127.0.0.1:WEB_HOST_PORT/healthz). nginx máy chủ chuyển /healthz tới
        # api, nên đường này không lộ ra ngoài.
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            if (!-f $document_root/index.html) {
                return 503 "no index.html\n";
            }
            return 200 "ok\n";
        }

        # File ẩn (.well-known, .git…) — dist không có; không phục vụ.
        location ~ /\. {
            return 404;
        }

        # File build có hash: có → immutable 1 năm; thiếu → 404 (không fallback).
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA: file tĩnh nếu có, còn lại index.html (React Router). Thiếu cả index.html → 404, không lặp thành 500.
        location / {
            try_files $uri /index.html =404;
            add_header Cache-Control "no-cache";
        }

        location @not_found {
            # types rỗng: Content-Type không lấy theo đuôi URI (vd /assets/x.js) mà luôn là text/plain.
            types { }
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 404 "not found\n";
        }
    }
}
