# OnTheTopMoney production trên một VPS (Structural Seed › Container và triển khai).
# Chạy trong thư mục deploy/: biến lấy từ deploy/.env (sao chép từ env.production.example).
#   (sửa IMAGE_TAG=v3 trong deploy/.env) docker compose up -d --build   build + up bản mới — tag mới mỗi lần để rollback
#     được. `IMAGE_TAG=v3 docker compose up …` cũng chạy, nhưng lệnh compose sau đó (không kèm biến) lại dùng tag
#     trong .env — nên ghi tag vào .env (runbook mục 2).
#   docker compose up -d                          chạy lại / rollback (IMAGE_TAG trong deploy/.env, không --build)
#   docker compose run --rm api node scripts/set-password.ts
#   (không có backup tự động — sao lưu tay bằng pg_dump: runbook.md mục "Sao lưu tay")
#
# Không có reverse proxy trong stack: nginx trên máy chủ (chủ shop tự quản, TLS bằng certbot) mở 80/443,
# chuyển phần api tới 127.0.0.1:${API_HOST_PORT} và phần web (`/`) tới 127.0.0.1:${WEB_HOST_PORT}
# (mẫu: deploy/nginx.conf.example). Ảnh/file nằm trên Cloudinary (CLOUDINARY_URL), không lưu trên máy chủ. api và web chỉ publish trên 127.0.0.1;
# worker, postgres không publish cổng nào. Không service nào giữ 80/443.
# Service `web` thuộc profile `web`: deploy/.env đặt COMPOSE_PROFILES=web (web chạy trên VPS) nên
# `docker compose up -d --build` chạy luôn web; COMPOSE_PROFILES trống = web ở Hostinger (runbook mục 8), VPS chỉ chạy BE.
# IMAGE_TAG không đặt → `latest` (build lại cùng tag ghi đè image cũ — muốn rollback thì đặt tag mới mỗi lần).
# Mỗi service chỉ nhận đúng biến nó cần (không env_file chung): postgres không thấy APP_ENCRYPTION_KEYS,
# web không thấy biến nào của app. Thêm biến app mới → thêm vào x-app-env và env.production.example.

name: ottm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://ottm:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong deploy/.env}@postgres:5432/ottm
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?đặt PUBLIC_BASE_URL trong deploy/.env}
  # Origin được gửi request ghi + nhận CORS có credentials. Mặc định (web cùng VPS) = origin HTTPS công khai;
  # chế độ tách (web trên Hostinger) đặt ALLOWED_ORIGINS = origin web trong deploy/.env.
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_BASE_URL:?đặt PUBLIC_BASE_URL trong deploy/.env}}
  # Origin web cho chuyển hướng OAuth; trống = PUBLIC_BASE_URL (cùng VPS). Chế độ tách: origin web trên Hostinger.
  WEB_BASE_URL: ${WEB_BASE_URL:-}
  # api đứng sau đúng một hop reverse proxy (nginx của chủ shop, đặt X-Forwarded-For = $remote_addr).
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  META_APP_ID: ${META_APP_ID:-}
  META_APP_ENV: ${META_APP_ENV:-}
  # Khoá chủ mã hoá bí mật (Story 1.5) — bắt buộc: thiếu thì api/worker/migrate không khởi động.
  APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:?đặt APP_ENCRYPTION_KEYS trong deploy/.env}
  APP_ENCRYPTION_ACTIVE_KEY: ${APP_ENCRYPTION_ACTIVE_KEY:?đặt APP_ENCRYPTION_ACTIVE_KEY trong deploy/.env}
  # Kết nối Meta/Threads (Story 2.2, 2.3); để trống thì màn kết nối báo chưa cấu hình.
  META_APP_SECRET: ${META_APP_SECRET:-}
  # Tuỳ chọn: Configuration ID của Facebook Login for Business; trống → app gửi `scope`.
  META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
  THREADS_APP_ID: ${THREADS_APP_ID:-}
  THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
  THREADS_APP_ENV: ${THREADS_APP_ENV:-}
  # Ảnh bài đăng, logo (công khai) và file riêng tư (kho kiến thức, đính kèm) lưu trên Cloudinary.
  # cloudinary://<api_key>:<api_secret>@<cloud_name>; trống → tính năng media báo chưa cấu hình.
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-}

x-server: &server
  image: ottm-server:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.server
  environment: *app-env
  logging: *logging
  networks: [backend]

services:
  migrate:
    <<: *server
    command: ["node", "scripts/migrate.ts", "--wait"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    command: ["node", "src/app/main.ts"]
    restart: unless-stopped
    # Chỉ nginx trên máy chủ gọi được api: publish trên loopback, không bao giờ 0.0.0.0.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Tiến trình còn trả lời HTTP. 503 (worker cũ, đĩa đầy) vẫn tính là api sống — uptime ping ngoài báo 503.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.status===200||r.status===503?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *server
    command: ["node", "src/worker/main.ts"]
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Web tĩnh (profile `web`, COMPOSE_PROFILES=web): nginx unprivileged phục vụ web/dist, SPA fallback, Cache-Control. Header bảo mật, TLS do
  # nginx máy chủ đặt. Cùng IMAGE_TAG với api: rollback đổi cả hai. COMPOSE_PROFILES trống (web ở Hostinger): không build, không chạy.
  web:
    image: ottm-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    profiles: [web]
    restart: unless-stopped
    user: "101:101"
    read_only: true
    # Chỗ nginx cần ghi (pid, thư mục tạm) — root FS chỉ đọc.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Chỉ nginx trên máy chủ gọi được: publish trên loopback, không bao giờ 0.0.0.0.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks: [web]

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ottm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: ottm
    volumes:
      # Image postgres 18 đặt PGDATA dưới /var/lib/postgresql/18/docker: mount cả /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottm -d ottm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [backend]

networks:
  # Không `internal: true` vì api/worker cần ra internet (Meta, OpenAI, Cloudinary) — cô lập bằng
  # việc không publish cổng (trừ api, web trên 127.0.0.1).
  backend: {}
  # Riêng cho web: không cần tới postgres/api (chỉ phục vụ file, nginx máy chủ gọi qua cổng loopback).
  web: {}

volumes:
  pgdata: {}
