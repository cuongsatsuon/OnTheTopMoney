name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ottm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test tích hợp dùng Postgres service thay vì Postgres nhúng.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ottm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build web (production, cùng origin — không VITE_API_ORIGIN, không .htaccess)
        run: |
          npm run build -w web
          test ! -e web/dist/.htaccess
      - name: Build web chế độ tách (VITE_API_ORIGIN) — sai dạng thì build dừng; có .htaccess mang origin api
        run: |
          if VITE_API_ORIGIN=https://api.example.com/api npm run build -w web; then echo "build phải dừng khi VITE_API_ORIGIN có path"; exit 1; fi
          if VITE_API_ORIGIN=http://api.example.com npm run build -w web; then echo "build production phải dừng khi VITE_API_ORIGIN không https"; exit 1; fi
          VITE_API_ORIGIN=https://api.example.com npm run build -w web
          grep -q "connect-src 'self' https://api.example.com;" web/dist/.htaccess
          grep -rqF https://api.example.com web/dist/assets
      - name: .htaccess trên Apache thật (httpd:2.4, AllowOverride All) — SPA fallback, header, cache
        run: |
          for f in deploy/hostinger/*.sh; do bash -n "$f"; done
          docker run -d --name ottm-httpd -p 8088:80 -v "$PWD/web/dist:/usr/local/apache2/htdocs:ro" httpd:2.4-alpine \
            sh -c "sed -i -e 's/^#LoadModule rewrite_module/LoadModule rewrite_module/' \
                          -e 's/^#LoadModule expires_module/LoadModule expires_module/' \
                          -e 's/AllowOverride None/AllowOverride All/' /usr/local/apache2/conf/httpd.conf && exec httpd-foreground"
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8088/ && break; sleep 0.5; done
          bash deploy/hostinger/check-htaccess.sh http://localhost:8088 https://api.example.com || { docker logs ottm-httpd; exit 1; }
          docker rm -f ottm-httpd
      - name: Drizzle migrations nhất quán và khớp schema
        working-directory: server
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          # Schema Drizzle đổi mà quên sinh migration → generate tạo file mới → CI đỏ.
          test -z "$(git status --porcelain -- drizzle)" || { git status --porcelain -- drizzle; exit 1; }

  # Story 1.3 (1.3b: reverse proxy là nginx của chủ shop; 1.3d: web là service Docker `web`): dựng image production
  # bằng deploy.sh, chạy cả stack compose, dựng nginx chính thức từ deploy/nginx.conf.example (cổng 80, không TLS) và
  # gọi thử qua nó, thử deploy/rollback/dọn image, backup và khôi phục (kể cả khôi phục đè DB đã migrate xa hơn snapshot).
  deploy-smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: deploy
    env:
      SKIP_PREDEPLOY_BACKUP: "1"
      SMOKE_URL: http://localhost
      # Tag minor cố định của image nginx chính thức.
      NGINX_IMAGE: nginx:1.27-alpine
      # Khác giá trị mặc định để kiểm cả việc thay đường dẫn/cổng trong mẫu nginx.
      CI_MEDIA_DIR: /srv/ottm-ci/media
      CI_API_PORT: "3100"
      CI_WEB_PORT: "3180"
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng đĩa (healthz báo 503 khi đĩa >85%)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Thư mục trên máy chủ (MEDIA_DIR_HOST uid 1000)
        run: |
          sudo install -d -o 1000 -g 1000 -m 755 "$CI_MEDIA_DIR"
          ls -ld "$CI_MEDIA_DIR"
      - name: Tạo deploy/.env với bí mật thử
        run: |
          cp env.production.example .env
          source ./lib.sh
          env_set PUBLIC_BASE_URL https://ottm-ci.example.test
          env_set MEDIA_DIR_HOST "$CI_MEDIA_DIR"
          env_set API_HOST_PORT "$CI_API_PORT"
          env_set WEB_HOST_PORT "$CI_WEB_PORT"
          env_set POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          env_set APP_ENCRYPTION_KEYS "k1:$(openssl rand -base64 32)"
          env_set APP_ENCRYPTION_ACTIVE_KEY k1
          env_set IMAGE_TAG ci-config
          grep -v -e PASSWORD -e APP_ENCRYPTION_KEYS .env
      - name: docker compose config — chỉ api, web publish, trên 127.0.0.1; web không root, chỉ đọc; không ai giữ 80/443; media là bind mount
        run: |
          docker compose config --quiet
          docker compose --profile web --profile backup --profile restore config --quiet
          # .env mẫu (vps) có COMPOSE_PROFILES=web → `docker compose up -d --build` gõ tay chạy luôn web.
          grep -qx web <<<"$(docker compose config --services)"
          # Không bật profile (COMPOSE_PROFILES trống = WEB_MODE=external) → web không nằm trong danh sách chạy.
          services="$(COMPOSE_PROFILES= docker compose config --services)"
          echo "$services"
          if grep -qx web <<<"$services"; then echo "web phải thuộc profile web"; exit 1; fi
          grep -qx web <<<"$(docker compose --profile web config --services)"
          cfg="$(docker compose --profile web --profile backup --profile restore config --format json)"
          published="$(jq -r '.services | to_entries[] | select((.value.ports // []) | length > 0) | .key' <<<"$cfg" | sort | tr '\n' ' ')"
          echo "service có publish cổng: $published"
          test "$published" = "api web "
          jq '.services.api.ports, .services.web.ports' <<<"$cfg"
          jq -e --arg p "$CI_API_PORT" '.services.api.ports | length == 1
            and .[0].host_ip == "127.0.0.1" and .[0].target == 3000 and (.[0].published | tostring) == $p' <<<"$cfg"
          jq -e --arg p "$CI_WEB_PORT" '.services.web.ports | length == 1
            and .[0].host_ip == "127.0.0.1" and .[0].target == 8080 and (.[0].published | tostring) == $p' <<<"$cfg"
          jq -e '.services.web | .read_only == true and .user == "101:101" and (.tmpfs | length) == 1
            and (.cap_drop == ["ALL"]) and (.healthcheck.test | length) > 0 and (.volumes // [] | length) == 0' <<<"$cfg"
          jq -e '.services.web.image | startswith("ottm-web:")' <<<"$cfg"
          jq -e '.services.web | (.networks | keys) == ["web"]
            and (.security_opt | index("no-new-privileges:true")) != null
            and (.tmpfs[0] | split(":")[1] | split(",") | contains(["noexec", "nosuid", "nodev"]))' <<<"$cfg"
          jq -e '[.services[].ports[]? | .published | tostring] | any(. == "80" or . == "443") | not' <<<"$cfg"
          for s in api worker backup restore; do
            jq -e --arg s "$s" --arg m "$CI_MEDIA_DIR" \
              '[.services[$s].volumes[] | select(.target == "/data/media")] | length == 1 and .[0].type == "bind" and .[0].source == $m' <<<"$cfg"
          done
          if jq -e '.volumes | has("media")' <<<"$cfg"; then echo "còn named volume media"; exit 1; fi
      - name: Bash scripts hợp lệ
        run: for f in ./*.sh backup/*.sh hostinger/*.sh; do bash -n "$f"; done
      - name: nginx từ mẫu deploy/nginx.conf.example (cổng 80, không TLS) — nginx -t, chạy trên host network
        run: |
          mkdir -p "$RUNNER_TEMP/nginx"
          conf="$RUNNER_TEMP/nginx/ottm.conf"
          # Bỏ khối redirect 80→443 và TLS (ký hiệu trong mẫu), thay host/đường dẫn/cổng bằng giá trị của CI.
          sed -e '/^# >>> REDIRECT-80$/,/^# <<< REDIRECT-80$/d' \
              -e '/^[[:space:]]*ssl_/d' \
              -e '/^[[:space:]]*listen \[::\]:443/d' \
              -e 's/^\([[:space:]]*\)listen 443 ssl http2;/\1listen 80;/' \
              -e 's/app\.example\.com/localhost/g' \
              -e "s#/var/lib/ottm/media#$CI_MEDIA_DIR#g" \
              -e "s/127\.0\.0\.1:3000;/127.0.0.1:$CI_API_PORT;/" \
              -e "s/127\.0\.0\.1:3080;/127.0.0.1:$CI_WEB_PORT;/" \
              nginx.conf.example > "$conf"
          grep -nE '^[[:space:]]*(listen|server |root|alias|server_name|disable_symlinks|proxy_pass)' "$conf"
          # Không còn TLS hay giá trị mẫu ngoài chú thích (ký hiệu trong mẫu bị đổi → bước này đỏ).
          if grep -nE '^[^#]*(ssl|443|example\.com|/var/www|/var/lib/ottm|127\.0\.0\.1:3000|127\.0\.0\.1:3080)' "$conf"; then
            echo "mẫu nginx còn TLS/giá trị mẫu sau khi thay — ký hiệu cho CI trong nginx.conf.example đã đổi?"; exit 1
          fi
          grep -q '^[[:space:]]*listen 80;' "$conf"
          grep -q "server 127.0.0.1:$CI_WEB_PORT;" "$conf"
          NGINX_RUN=(--network host
            -v "$conf:/etc/nginx/conf.d/default.conf:ro"
            -v "$CI_MEDIA_DIR:$CI_MEDIA_DIR:ro")
          docker run --rm "${NGINX_RUN[@]}" "$NGINX_IMAGE" nginx -t
          docker run -d --name ottm-nginx "${NGINX_RUN[@]}" "$NGINX_IMAGE"
          sleep 1
          docker ps --filter name=ottm-nginx
      - name: nginx -t mẫu chế độ tách deploy/nginx-api.conf.example (host api, cổng 8081, không TLS) — riêng và song song mẫu cùng VPS
        run: |
          conf="$RUNNER_TEMP/nginx/ottm-api.conf"
          sed -e '/^# >>> REDIRECT-80$/,/^# <<< REDIRECT-80$/d' \
              -e '/^[[:space:]]*ssl_/d' \
              -e '/^[[:space:]]*listen \[::\]:443/d' \
              -e 's/^\([[:space:]]*\)listen 443 ssl http2;/\1listen 8081;/' \
              -e 's/api\.example\.com/localhost/g' \
              -e "s#/var/lib/ottm/media#$CI_MEDIA_DIR#g" \
              -e "s/127\.0\.0\.1:3000;/127.0.0.1:$CI_API_PORT;/" \
              nginx-api.conf.example > "$conf"
          if grep -nE '^[^#]*(ssl|443|example\.com|/var/lib/ottm|127\.0\.0\.1:3000)' "$conf"; then
            echo "mẫu nginx-api còn TLS/giá trị mẫu sau khi thay — ký hiệu cho CI đã đổi?"; exit 1
          fi
          grep -q '^[[:space:]]*listen 8081;' "$conf"
          # Kiểm riêng và kiểm cùng mẫu cùng VPS (tên map/upstream/zone không trùng → cài song song được).
          docker run --rm -v "$conf:/etc/nginx/conf.d/default.conf:ro" -v "$CI_MEDIA_DIR:$CI_MEDIA_DIR:ro" "$NGINX_IMAGE" nginx -t
          docker run --rm -v "$conf:/etc/nginx/conf.d/api.conf:ro" -v "$RUNNER_TEMP/nginx/ottm.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$CI_MEDIA_DIR:$CI_MEDIA_DIR:ro" "$NGINX_IMAGE" nginx -t
      - name: WEB_HOST_PORT sai/trùng API_HOST_PORT → deploy.sh dừng trước mọi thay đổi
        run: |
          source ./lib.sh
          for bad in 0 70000 abc "$CI_API_PORT"; do
            if WEB_HOST_PORT="$bad" IMAGE_TAG=ci-port bash ./deploy.sh; then echo "WEB_HOST_PORT=$bad phải bị từ chối"; exit 1; fi
          done
          test "$(env_get IMAGE_TAG)" = ci-config
          if docker image inspect ottm-server:ci-port >/dev/null 2>&1; then echo "không được build khi cổng sai"; exit 1; fi
          # Cổng hợp lệ nhưng bị tiến trình khác giữ → dừng trước build/ghi IMAGE_TAG, nêu cổng.
          busy=3190
          python3 -m http.server "$busy" --bind 127.0.0.1 >/dev/null 2>&1 &
          busy_pid=$!
          for i in $(seq 1 20); do [[ -n "$(ss -ltnH "( sport = :$busy )")" ]] && break; sleep 0.5; done
          set +e; out="$(WEB_HOST_PORT="$busy" IMAGE_TAG=ci-port bash ./deploy.sh 2>&1)"; code=$?; set -e
          kill "$busy_pid" || true
          echo "$out"
          test "$code" -ne 0
          grep -q "cổng $busy (WEB_HOST_PORT)" <<<"$out"
          test "$(env_get IMAGE_TAG)" = ci-config
          if docker image inspect ottm-server:ci-port >/dev/null 2>&1; then echo "không được build khi cổng bận"; exit 1; fi
      - name: deploy.sh (tag ci-a)
        run: |
          IMAGE_TAG=ci-a bash ./deploy.sh
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose --profile web ps -q web)")" = ottm-web:ci-a
      - name: Container web — healthy, không root, root FS chỉ đọc, đúng image, chỉ 127.0.0.1
        run: |
          cid="$(docker compose --profile web ps -q web)"
          test -n "$cid"
          for i in $(seq 1 45); do
            st="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            [[ "$st" == healthy ]] && break
            sleep 2
          done
          echo "health: $st"
          test "$st" = healthy
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          test "$(docker inspect --format '{{index .Config.Labels "org.ottm.web"}}' "$cid")" = nginx
          uid="$(docker exec "$cid" id -u)"
          echo "uid trong container: $uid"
          test "$uid" != 0
          if docker exec "$cid" sh -c 'touch /usr/share/nginx/html/x || touch /etc/nginx/x'; then echo "root FS ghi được"; exit 1; fi
          docker exec "$cid" sh -c 'touch /tmp/x && rm /tmp/x'
          ss -ltnH "( sport = :$CI_WEB_PORT )" || true
          addrs="$(ss -ltnH "( sport = :$CI_WEB_PORT )" | awk '{print $4}')"
          test -n "$addrs" || { echo "không thấy socket nào nghe cổng $CI_WEB_PORT — không kiểm được"; exit 1; }
          if grep -v "^127\.0\.0\.1:$CI_WEB_PORT$" <<<"$addrs" | grep .; then echo "web nghe ngoài 127.0.0.1"; exit 1; fi
          ip="$(hostname -I | awk '{print $1}')"
          test -n "$ip"
          if curl -s --max-time 3 "http://$ip:$CI_WEB_PORT/"; then echo "web lộ cổng $CI_WEB_PORT trên $ip"; exit 1; fi
          # Gọi thẳng container (không qua nginx): chỉ Cache-Control, không header bảo mật (nginx máy chủ đặt).
          h="$RUNNER_TEMP/web.headers"
          test "$(curl -s -D "$h" -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_WEB_PORT/trang-nhom/abc")" = 200
          cat "$h"
          test "$(grep -ci '^cache-control:' "$h")" = 1
          grep -qi '^cache-control: no-cache' "$h"
          if grep -qi '^content-security-policy:' "$h"; then echo "container web không được tự đặt CSP"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_WEB_PORT/healthz")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_WEB_PORT/.env")" = 404
          # Asset thiếu → 404 chữ (không phải HTML, không index.html), no-store; asset có → immutable.
          test "$(curl -s -D "$h" -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_WEB_PORT/assets/khong-co.js")" = 404
          grep -qi '^content-type: text/plain' "$h"
          grep -qi '^cache-control: no-store' "$h"
          asset="$(curl -s "http://127.0.0.1:$CI_WEB_PORT/" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | head -n1)"
          test -n "$asset"
          test "$(curl -s -D "$h" -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_WEB_PORT$asset")" = 200
          test "$(grep -ci '^cache-control:' "$h")" = 1
          grep -qi '^cache-control: public, max-age=31536000, immutable' "$h"
      - name: migrate chạy xong với exit 0
        run: test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")" = "0"
      - name: api chỉ nghe trên 127.0.0.1, postgres không lộ ra máy chủ
        run: |
          # Socket đang nghe trên cổng api (docker-proxy): chỉ được là 127.0.0.1.
          ss -ltnH "( sport = :$CI_API_PORT )" || true
          addrs="$(ss -ltnH "( sport = :$CI_API_PORT )" | awk '{print $4}')"
          test -n "$addrs" || { echo "không thấy socket nào nghe cổng $CI_API_PORT — không kiểm được"; exit 1; }
          if grep -v "^127\.0\.0\.1:$CI_API_PORT$" <<<"$addrs" | grep .; then echo "api nghe ngoài 127.0.0.1"; exit 1; fi
          code="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$CI_API_PORT/healthz" || true)"
          echo "api qua 127.0.0.1:$CI_API_PORT: $code"
          [[ "$code" == 200 || "$code" == 503 ]]
          ip="$(hostname -I | awk '{print $1}')"
          test -n "$ip" || { echo "không lấy được IP máy (hostname -I) — không kiểm được"; exit 1; }
          if curl -s --max-time 3 "http://$ip:$CI_API_PORT/healthz"; then echo "api lộ cổng $CI_API_PORT trên $ip"; exit 1; fi
          # `! cmd` không làm bước đỏ dưới bash -e → dùng if.
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "postgres lộ cổng 5432"; exit 1; fi
          echo "api chỉ ở 127.0.0.1:$CI_API_PORT; cổng 80 là nginx"
      - name: Đặt file thử vào thư mục media (bind mount)
        run: |
          docker compose exec -T api sh -c 'printf "media ok\n" > /data/media/smoke.txt'
          ls -ln "$CI_MEDIA_DIR"
      - name: Gọi qua nginx theo ma trận route/header/SPA/media
        env:
          ORIGIN: https://ottm-ci.example.test
          SMOKE_LOGIN: "1"
          SMOKE_MEDIA_FILE: smoke.txt
          SMOKE_MEDIA_CONTENT: media ok
          SMOKE_ALLOW_DISK_FULL: "1"
        run: bash ./smoke-test.sh http://localhost
      - name: Chạy nginx mẫu chế độ tách (nginx-api, cổng 8081) trước stack đang chạy — smoke SMOKE_MODE=api
        env:
          # Stack đang ở WEB_MODE=vps: ALLOWED_ORIGINS = PUBLIC_BASE_URL — origin hợp lệ cho CORS.
          ORIGIN: https://ottm-ci.example.test
          SMOKE_MEDIA_FILE: smoke.txt
          SMOKE_MEDIA_CONTENT: media ok
          SMOKE_ALLOW_DISK_FULL: "1"
        run: |
          docker run -d --name ottm-nginx-api --network host \
            -v "$RUNNER_TEMP/nginx/ottm-api.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$CI_MEDIA_DIR:$CI_MEDIA_DIR:ro" "$NGINX_IMAGE"
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8081/healthz && break; sleep 0.5; done
          SMOKE_MODE=api bash ./smoke-test.sh http://localhost:8081
          # SMOKE_MODE=api thiếu ORIGIN → exit 2 (không đoán origin).
          set +e; SMOKE_MODE=api ORIGIN= bash ./smoke-test.sh http://localhost:8081 >/dev/null; code=$?; set -e
          test "$code" = 2
      - name: nginx không ghi access log cho /oauth, /webhooks
        run: |
          logs="$(docker logs ottm-nginx 2>/dev/null)"
          grep -q '"GET /healthz' <<<"$logs" || { echo "access log không hoạt động — không kiểm được"; exit 1; }
          if grep -E '"[A-Z]+ /(oauth|webhooks)' <<<"$logs"; then echo "access log có /oauth hoặc /webhooks"; exit 1; fi
          echo "không có dòng /oauth, /webhooks trong access log"
      - name: Body quá 2 MB → nginx trả JSON 413; api dừng → JSON INTERNAL (502); cả hai no-store + header bảo mật
        run: |
          h="$RUNNER_TEMP/err.headers"
          b="$RUNNER_TEMP/err.body"
          head -c 3000000 /dev/zero > "$RUNNER_TEMP/big.bin"
          code="$(curl -s --max-time 20 -D "$h" -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/big.bin" http://localhost/api/v1/auth/login || true)"
          cat "$h" "$b"; echo
          test "$code" = 413
          grep -qi '^content-type: application/json' "$h"
          grep -qi '^cache-control: no-store' "$h"
          grep -q '"code":"VALIDATION_FAILED"' "$b"
          # Đường web (location / → container): 413 cũng là JSON VALIDATION_FAILED.
          code="$(curl -s --max-time 20 -D "$h" -o "$b" -w '%{http_code}' -X POST \
            --data-binary "@$RUNNER_TEMP/big.bin" http://localhost/trang-nhom/abc || true)"
          cat "$h" "$b"; echo
          test "$code" = 413
          grep -qi '^content-type: application/json' "$h"
          grep -q '"code":"VALIDATION_FAILED"' "$b"
          # Mẫu nginx-api: cùng hành vi 413 JSON.
          code="$(curl -s --max-time 20 -D "$h" -o "$b" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/big.bin" http://localhost:8081/api/v1/auth/login || true)"
          test "$code" = 413
          grep -qi '^cache-control: no-store' "$h"
          grep -q '"code":"VALIDATION_FAILED"' "$b"
          docker compose stop api
          code="$(curl -s --max-time 10 -D "$h" -o "$b" -w '%{http_code}' 'http://localhost/oauth/meta/callback?code=bi-mat-ci' || true)"
          test "$code" = 502
          code="$(curl -s --max-time 10 -D "$h" -o "$b" -w '%{http_code}' http://localhost/api/v1/auth/me || true)"
          cat "$h" "$b"; echo
          test "$code" = 502
          grep -qi '^content-type: application/json' "$h"
          grep -qi '^content-security-policy: .*frame-ancestors' "$h"
          grep -qi '^cache-control: no-store' "$h"
          grep -q '{"error":{"code":"INTERNAL","message":"api unavailable"}}' "$b"
          # Request /oauth rơi vào trang lỗi không được ghi vào access log lẫn error log (query mang mã bí mật).
          if docker logs ottm-nginx 2>&1 | grep -F 'bi-mat-ci'; then echo "log nginx có query bí mật"; exit 1; fi
          # Mẫu nginx-api: api dừng → cùng JSON INTERNAL 502, no-store, CSP; /oauth không vào log.
          curl -s --max-time 10 -o /dev/null 'http://localhost:8081/oauth/meta/callback?code=bi-mat-ci-api' || true
          code="$(curl -s --max-time 10 -D "$h" -o "$b" -w '%{http_code}' http://localhost:8081/api/v1/auth/me || true)"
          cat "$h" "$b"; echo
          test "$code" = 502
          grep -qi '^content-type: application/json' "$h"
          grep -qi "^content-security-policy: default-src 'none'.*frame-ancestors" "$h"
          grep -qi '^cache-control: no-store' "$h"
          grep -q '{"error":{"code":"INTERNAL","message":"api unavailable"}}' "$b"
          if docker logs ottm-nginx-api 2>&1 | grep -F 'bi-mat-ci-api'; then echo "log nginx-api có query bí mật"; exit 1; fi
          docker compose start api
      - name: container web dừng → nginx trả 502 chữ (không phải JSON api), no-store, header bảo mật; api vẫn chạy
        run: |
          h="$RUNNER_TEMP/webdown.headers"
          b="$RUNNER_TEMP/webdown.body"
          # Bước trước vừa start lại api: chờ api + web khoẻ rồi mới dừng web.
          bash -c 'source ./lib.sh; wait_healthy 120'
          docker compose --profile web stop web
          # Web dừng → kiểm web và wait_healthy (vps chờ cả web) phải báo lỗi.
          if bash -c 'source ./lib.sh; wait_web_healthy 5'; then echo "wait_web_healthy phải lỗi khi web dừng"; exit 1; fi
          if bash -c 'source ./lib.sh; wait_healthy 35'; then echo "wait_healthy phải lỗi khi web dừng"; exit 1; fi
          code="$(curl -s --max-time 10 -D "$h" -o "$b" -w '%{http_code}' http://localhost/trang-nhom/abc || true)"
          cat "$h" "$b"; echo
          test "$code" = 502
          grep -qi '^content-type: text/plain' "$h"
          grep -q 'web unavailable' "$b"
          test "$(grep -ci '^cache-control:' "$h")" = 1
          grep -qi '^cache-control: no-store' "$h"
          grep -qi '^content-security-policy: .*frame-ancestors' "$h"
          grep -qi '^strict-transport-security:' "$h"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/auth/me)" = 401
          docker compose --profile web start web
          bash -c 'source ./lib.sh; wait_web_healthy 60'
      - name: deploy.sh (tag ci-b), rollback.sh ci-a
        run: |
          running_tag() {
            for s in api worker web; do docker inspect --format '{{.Config.Image}}' "$(docker compose --profile web ps -q "$s")"; done | sort -u
          }
          IMAGE_TAG=ci-b bash ./deploy.sh
          source ./lib.sh
          test "$(env_get IMAGE_TAG)" = ci-b
          running_tag
          test "$(running_tag | sed 's/.*://' | sort -u)" = ci-b
          test "$(running_tag | grep -c '^ottm-web:')" = 1
          bash ./rollback.sh ci-a
          test "$(env_get IMAGE_TAG)" = ci-a
          running_tag
          test "$(running_tag | sed 's/.*://' | sort -u)" = ci-a
          test "$(running_tag | grep -c '^ottm-web:')" = 1
          SMOKE_ALLOW_DISK_FULL=1 bash ./smoke-test.sh http://localhost
          # WEB_HOST_PORT trùng API_HOST_PORT → rollback dừng trước khi đổi IMAGE_TAG (dùng ci-b để thấy IMAGE_TAG không đổi).
          set +e; out="$(WEB_HOST_PORT="$CI_API_PORT" bash ./rollback.sh ci-b 2>&1)"; code=$?; set -e
          echo "$out"
          test "$code" -ne 0
          grep -q WEB_HOST_PORT <<<"$out"
          test "$(env_get IMAGE_TAG)" = ci-a
          test "$(running_tag | sed 's/.*://' | sort -u)" = ci-a
      - name: rollback.sh tới tag thiếu image web / image web cũ (chỉ dist) → dừng, không đổi gì
        run: |
          source ./lib.sh
          running_web() { docker inspect --format '{{.Config.Image}}' "$(docker compose --profile web ps -q web)"; }
          docker tag ottm-server:ci-a ottm-server:ci-noweb
          set +e; out="$(bash ./rollback.sh ci-noweb 2>&1)"; code=$?; set -e
          echo "$out"
          test "$code" -ne 0
          grep -q 'ottm-web:ci-noweb' <<<"$out"
          test "$(env_get IMAGE_TAG)" = ci-a
          test "$(running_web)" = ottm-web:ci-a
          # Image ottm-web kiểu cũ (FROM scratch, chỉ /dist, không nhãn org.ottm.web) → từ chối kèm hướng dẫn.
          docker tag ottm-server:ci-a ottm-server:ci-oldweb
          printf 'FROM scratch\nCOPY smoke-test.sh /dist/index.html\n' | docker build -q -t ottm-web:ci-oldweb -f - .
          set +e; out="$(bash ./rollback.sh ci-oldweb 2>&1)"; code=$?; set -e
          echo "$out"
          test "$code" -ne 0
          grep -q 'image cũ' <<<"$out"
          test "$(env_get IMAGE_TAG)" = ci-a
          test "$(running_web)" = ottm-web:ci-a
          docker image rm ottm-server:ci-noweb ottm-server:ci-oldweb ottm-web:ci-oldweb
      - name: prune_images giữ tag đang chạy cho mọi image (cả ottm-web), từ chối KEEP_TAGS sai
        run: |
          # ci-old: tag cũ của ottm-web (cùng image với ci-a) không nằm trong tập giữ → bị gỡ tag.
          docker tag ottm-web:ci-a ottm-web:ci-old
          if KEEP_TAGS=0 bash -c 'source ./lib.sh; prune_images ci-a'; then echo "KEEP_TAGS=0 phải bị từ chối"; exit 1; fi
          docker image inspect ottm-web:ci-old > /dev/null
          KEEP_TAGS=1 bash -c 'source ./lib.sh; prune_images ci-a'
          docker image ls 'ottm-*'
          docker image inspect ottm-server:ci-a ottm-web:ci-a ottm-backup:ci-a > /dev/null
          if docker image inspect ottm-web:ci-old >/dev/null 2>&1; then echo "prune phải xoá ottm-web:ci-old"; exit 1; fi
      - name: WEB_MODE — vps từ chối WEB_BASE_URL sót lại; external thiếu WEB_BASE_URL → dừng; external dừng + xoá web, không build web
        env:
          CI_EXT_WEB: https://ottm-ci-web.example.test
        run: |
          source ./lib.sh
          web_ids() { docker ps -aq --filter label=com.docker.compose.project=ottm --filter label=com.docker.compose.service=web; }
          test -n "$(web_ids)"
          tag_before="$(env_get IMAGE_TAG)"
          # vps + WEB_BASE_URL khác PUBLIC_BASE_URL → dừng trước build, không đổi gì.
          env_set WEB_BASE_URL "$CI_EXT_WEB"
          if IMAGE_TAG=ci-ext bash ./deploy.sh; then echo "vps với WEB_BASE_URL sót lại phải bị từ chối"; exit 1; fi
          test "$(env_get IMAGE_TAG)" = "$tag_before"
          # external + WEB_BASE_URL rỗng → dừng.
          env_set WEB_MODE external
          env_set COMPOSE_PROFILES ""
          env_set WEB_BASE_URL ""
          env_set ALLOWED_ORIGINS "$CI_EXT_WEB"
          if IMAGE_TAG=ci-ext bash ./deploy.sh; then echo "external thiếu WEB_BASE_URL phải bị từ chối"; exit 1; fi
          test "$(env_get IMAGE_TAG)" = "$tag_before"
          # external hợp lệ: compose truyền đúng cấu hình 2 host cho api.
          env_set WEB_BASE_URL "$CI_EXT_WEB"
          # external mà COMPOSE_PROFILES còn web → dừng trước build (compose gõ tay sẽ chạy web trên VPS).
          env_set COMPOSE_PROFILES web
          if IMAGE_TAG=ci-ext bash ./deploy.sh; then echo "external với COMPOSE_PROFILES=web phải bị từ chối"; exit 1; fi
          test "$(env_get IMAGE_TAG)" = "$tag_before"
          env_set COMPOSE_PROFILES ""
          cfg="$(docker compose config --format json)"
          jq -e --arg w "$CI_EXT_WEB" '.services.api.environment.WEB_BASE_URL == $w and .services.api.environment.ALLOWED_ORIGINS == $w
            and .services.api.environment.PUBLIC_BASE_URL == "https://ottm-ci.example.test"' <<<"$cfg"
          # deploy.sh external: smoke qua nginx-api (8081), ORIGIN = WEB_BASE_URL; không build ottm-web; container web
          # cũ (từ vps) bị dừng + xoá.
          IMAGE_TAG=ci-ext SMOKE_URL=http://localhost:8081 bash ./deploy.sh
          test "$(env_get IMAGE_TAG)" = ci-ext
          if docker image inspect ottm-web:ci-ext >/dev/null 2>&1; then echo "external không được build ottm-web"; exit 1; fi
          if [[ -n "$(web_ids)" ]]; then docker ps -a; echo "external phải dừng + xoá container web"; exit 1; fi
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: $CI_EXT_WEB" -H 'Access-Control-Request-Method: POST' \
            http://localhost:8081/api/v1/auth/login | grep -qi "^access-control-allow-origin: $CI_EXT_WEB"
          # external: rollback không cần ottm-web:<tag>, không chạy web — và dọn container web còn sót.
          IMAGE_TAG=ci-a docker compose --profile web up -d --no-build web
          test -n "$(web_ids)"
          bash ./rollback.sh ci-a
          test "$(env_get IMAGE_TAG)" = ci-a
          test -z "$(web_ids)"
          # Trả về vps cho các bước sau: rollback.sh (vps) chạy lại container web cùng tag.
          env_set WEB_MODE vps
          env_set COMPOSE_PROFILES web
          env_set WEB_BASE_URL ""
          env_set ALLOWED_ORIGINS ""
          bash ./rollback.sh ci-a
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose --profile web ps -q web)")" = ottm-web:ci-a
          ORIGIN=https://ottm-ci.example.test SMOKE_ALLOW_DISK_FULL=1 bash ./smoke-test.sh http://localhost
      - name: Backup + khôi phục trong container ottm-backup (kho restic cục bộ)
        run: |
          docker compose run --rm -T --no-deps -v "$PWD/backup:/test:ro" --entrypoint bash backup /test/test-backup.sh
      - name: Backup thiếu cấu hình → exit ≠ 0, báo tên biến
        run: |
          set +e
          out="$(docker compose run --rm -T --no-deps backup 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q RESTIC_REPOSITORY
      - name: restore thiếu --yes → từ chối
        run: |
          set +e
          out="$(docker compose --profile restore run --rm -T --no-deps restore latest 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q -- "thêm --yes"
      - name: Khôi phục đè DB đã migrate xa hơn snapshot, rồi migrate vẫn chạy được
        run: |
          mkdir -p "$RUNNER_TEMP/restic"
          R=(-v "$RUNNER_TEMP/restic:/restic" -e RESTIC_REPOSITORY=/restic -e RESTIC_PASSWORD=ci-restic)
          pg() { docker compose exec -T postgres psql -U ottm -d ottm -v ON_ERROR_STOP=1 -qtAX -c "$1"; }
          docker compose run --rm -T "${R[@]}" --entrypoint restic backup init
          docker compose stop api worker
          # Snapshot ở trạng thái "migration trước": bỏ bảng và dòng của migration cuối.
          pg "drop table sessions, secrets; delete from drizzle.__drizzle_migrations where id = (select max(id) from drizzle.__drizzle_migrations)"
          docker compose run --rm -T "${R[@]}" backup
          # DB tiến lên bản mới hơn snapshot (migration cuối + một bảng lạ).
          docker compose run --rm -T migrate
          pg "create table bang_moi_hon (id int)"
          docker compose run --rm -T "${R[@]}" restore latest --yes
          test "$(pg "select count(*) from information_schema.tables where table_name in ('bang_moi_hon', 'sessions', 'secrets')")" = 0
          docker compose run --rm -T migrate
          test "$(pg "select count(*) from information_schema.tables where table_name in ('sessions', 'secrets')")" = 2
          docker compose up -d
          for i in $(seq 1 60); do
            curl -s --max-time 5 http://localhost/healthz | grep -q '"worker":"ok"' && break
            sleep 2
          done
          SMOKE_MEDIA_FILE=smoke.txt SMOKE_MEDIA_CONTENT="media ok" SMOKE_ALLOW_DISK_FULL=1 bash ./smoke-test.sh http://localhost
      - name: Log khi lỗi
        if: failure()
        run: |
          docker compose --profile web --profile backup logs --tail=200
          docker compose --profile web ps -a || true
          docker logs --tail=200 ottm-nginx || true
          docker logs --tail=200 ottm-nginx-api || true
          ls -la "$CI_MEDIA_DIR" || true
      - name: Dọn
        if: always()
        run: |
          docker rm -f ottm-nginx ottm-nginx-api || true
          docker compose --profile web --profile backup --profile restore down -v --remove-orphans
