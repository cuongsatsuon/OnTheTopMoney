name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ottm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test tích hợp dùng Postgres service thay vì Postgres nhúng.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ottm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build web (production, cùng origin — không VITE_API_ORIGIN, không .htaccess)
        run: |
          npm run build -w web
          test ! -e web/dist/.htaccess
      - name: Build web chế độ tách (VITE_API_ORIGIN) — sai dạng thì build dừng; có .htaccess mang origin api
        run: |
          if VITE_API_ORIGIN=https://api.example.com/api npm run build -w web; then echo "build phải dừng khi VITE_API_ORIGIN có path"; exit 1; fi
          if VITE_API_ORIGIN=http://api.example.com npm run build -w web; then echo "build production phải dừng khi VITE_API_ORIGIN không https"; exit 1; fi
          VITE_API_ORIGIN=https://api.example.com npm run build -w web
          grep -q "connect-src 'self' https://api.example.com;" web/dist/.htaccess
          grep -rqF https://api.example.com web/dist/assets
      - name: .htaccess trên Apache thật (httpd:2.4, AllowOverride All) — SPA fallback, header, cache
        run: |
          for f in deploy/hostinger/*.sh; do bash -n "$f"; done
          docker run -d --name ottm-httpd -p 8088:80 -v "$PWD/web/dist:/usr/local/apache2/htdocs:ro" httpd:2.4-alpine \
            sh -c "sed -i -e 's/^#LoadModule rewrite_module/LoadModule rewrite_module/' \
                          -e 's/^#LoadModule expires_module/LoadModule expires_module/' \
                          -e 's/AllowOverride None/AllowOverride All/' /usr/local/apache2/conf/httpd.conf && exec httpd-foreground"
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8088/ && break; sleep 0.5; done
          bash deploy/hostinger/check-htaccess.sh http://localhost:8088 https://api.example.com || { docker logs ottm-httpd; exit 1; }
          docker rm -f ottm-httpd
      - name: Drizzle migrations nhất quán và khớp schema
        working-directory: server
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          # Schema Drizzle đổi mà quên sinh migration → generate tạo file mới → CI đỏ.
          test -z "$(git status --porcelain -- drizzle)" || { git status --porcelain -- drizzle; exit 1; }

  # Triển khai thủ công bằng docker compose (spec bo-script-deploy): kiểm cấu hình compose (profile web/không web), hai
  # mẫu nginx (`nginx -t`), build image production, media:check trong image api. Không có backup tự động nên
  # không có bước sao lưu/khôi phục.
  deploy-config:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    env:
      # Tag minor cố định của image nginx chính thức.
      NGINX_IMAGE: nginx:1.27-alpine
      # Khác giá trị mặc định để kiểm cả việc thay cổng trong mẫu nginx.
      CI_API_PORT: "3100"
      CI_WEB_PORT: "3180"
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng đĩa (build image)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Tạo deploy/.env với bí mật thử
        run: |
          cp env.production.example .env
          set_env() { grep -q "^$1=" .env && sed -i "s|^$1=.*|$1=$2|" .env || printf '%s=%s\n' "$1" "$2" >> .env; }
          set_env PUBLIC_BASE_URL https://ottm-ci.example.test
          set_env API_HOST_PORT "$CI_API_PORT"
          set_env WEB_HOST_PORT "$CI_WEB_PORT"
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_env APP_ENCRYPTION_KEYS "k1:$(openssl rand -base64 32)"
          set_env APP_ENCRYPTION_ACTIVE_KEY k1
          set_env IMAGE_TAG ci-config
          grep -v -e PASSWORD -e APP_ENCRYPTION_KEYS .env
      - name: docker compose config — chỉ api, web publish, trên 127.0.0.1; web không root, chỉ đọc; không ai giữ 80/443; không lưu media trên máy chủ
        run: |
          docker compose config --quiet
          docker compose --profile web config --quiet
          # IMAGE_TAG không đặt → mặc định latest (chạy tay không cần script ghi tag).
          no_tag="$(docker compose --env-file <(grep -v '^IMAGE_TAG=' .env) --profile web config --format json)"
          jq -e '[.services[].image | select(startswith("ottm-"))] | length == 4 and all(endswith(":latest"))' <<<"$no_tag"
          # Không còn hệ thống sao lưu tự động: bật MỌI profile vẫn chỉ có đúng năm service này, image chỉ ottm-server /
          # ottm-web / postgres, profile duy nhất là `web`, volume duy nhất là pgdata.
          all_services="$(docker compose --profile '*' config --services | sort | tr '\n' ' ')"
          echo "mọi service: $all_services"
          test "$all_services" = "api migrate postgres web worker "
          full="$(docker compose --profile '*' config --format json)"
          jq -e '[.services[].image] | all(test("^(ottm-server|ottm-web):") or startswith("postgres:"))' <<<"$full"
          jq -e '[.services[] | (.profiles // [])[]] | unique == ["web"]' <<<"$full"
          jq -e '(.volumes | keys) == ["pgdata"]' <<<"$full"
          # .env mẫu có COMPOSE_PROFILES=web → `docker compose up -d --build` gõ tay chạy luôn web.
          grep -qx web <<<"$(docker compose config --services)"
          # Không bật profile (COMPOSE_PROFILES trống = web ở Hostinger) → web không nằm trong danh sách chạy.
          services="$(COMPOSE_PROFILES= docker compose config --services)"
          echo "$services"
          if grep -qx web <<<"$services"; then echo "web phải thuộc profile web"; exit 1; fi
          grep -qx web <<<"$(docker compose --profile web config --services)"
          cfg="$(docker compose --profile web config --format json)"
          published="$(jq -r '.services | to_entries[] | select((.value.ports // []) | length > 0) | .key' <<<"$cfg" | sort | tr '\n' ' ')"
          echo "service có publish cổng: $published"
          test "$published" = "api web "
          jq '.services.api.ports, .services.web.ports' <<<"$cfg"
          jq -e --arg p "$CI_API_PORT" '.services.api.ports | length == 1
            and .[0].host_ip == "127.0.0.1" and .[0].target == 3000 and (.[0].published | tostring) == $p' <<<"$cfg"
          jq -e --arg p "$CI_WEB_PORT" '.services.web.ports | length == 1
            and .[0].host_ip == "127.0.0.1" and .[0].target == 8080 and (.[0].published | tostring) == $p' <<<"$cfg"
          jq -e '.services.web | .read_only == true and .user == "101:101" and (.tmpfs | length) == 1
            and (.cap_drop == ["ALL"]) and (.healthcheck.test | length) > 0 and (.volumes // [] | length) == 0' <<<"$cfg"
          jq -e '.services.web.image == "ottm-web:ci-config" and .services.api.image == "ottm-server:ci-config"' <<<"$cfg"
          jq -e '.services.web | (.networks | keys) == ["web"]
            and (.security_opt | index("no-new-privileges:true")) != null
            and (.tmpfs[0] | split(":")[1] | split(",") | contains(["noexec", "nosuid", "nodev"]))' <<<"$cfg"
          jq -e '[.services[].ports[]? | .published | tostring] | any(. == "80" or . == "443") | not' <<<"$cfg"
          # Media nằm trên Cloudinary (AD-14): không service nào mount thư mục/volume media; api/worker nhận CLOUDINARY_*;
          # healthz đo đĩa ở / (mặc định).
          if jq -e '[.services[] | (.volumes // [])[] | select((.target // "") | test("media"))] | length > 0' <<<"$cfg"; then
            echo "còn mount media"; exit 1
          fi
          if jq -e '.volumes | has("media")' <<<"$cfg"; then echo "còn named volume media"; exit 1; fi
          for s in api worker; do
            jq -e --arg s "$s" '.services[$s].environment | has("CLOUDINARY_URL") and has("CLOUDINARY_FOLDER") and (has("HEALTH_DISK_PATH") | not)' <<<"$cfg"
          done
      - name: Bash scripts hợp lệ
        run: for f in hostinger/*.sh; do bash -n "$f"; done
      - name: nginx -t mẫu deploy/nginx.conf.example (cổng 80, không TLS)
        run: |
          mkdir -p "$RUNNER_TEMP/nginx"
          conf="$RUNNER_TEMP/nginx/ottm.conf"
          # Bỏ khối redirect 80→443 và TLS (ký hiệu trong mẫu), thay host/đường dẫn/cổng bằng giá trị của CI.
          sed -e '/^# >>> REDIRECT-80$/,/^# <<< REDIRECT-80$/d' \
              -e '/^[[:space:]]*ssl_/d' \
              -e '/^[[:space:]]*listen \[::\]:443/d' \
              -e 's/^\([[:space:]]*\)listen 443 ssl http2;/\1listen 80;/' \
              -e 's/app\.example\.com/localhost/g' \
              -e "s/127\.0\.0\.1:3000;/127.0.0.1:$CI_API_PORT;/" \
              -e "s/127\.0\.0\.1:3080;/127.0.0.1:$CI_WEB_PORT;/" \
              nginx.conf.example > "$conf"
          grep -nE '^[[:space:]]*(listen|server |root|alias|server_name|proxy_pass)' "$conf"
          # Không còn phục vụ /media từ máy chủ; CSP cho phép ảnh Cloudinary.
          if grep -nE '^[^#]*(location[^{]*/media|alias)' "$conf"; then echo "mẫu nginx còn phục vụ /media"; exit 1; fi
          grep -qE "^[^#]*Content-Security-Policy \"[^\"]*img-src [^;\"]*https://res\.cloudinary\.com" "$conf"
          # Không còn TLS hay giá trị mẫu ngoài chú thích (ký hiệu trong mẫu bị đổi → bước này đỏ).
          if grep -nE '^[^#]*(ssl|443|example\.com|/var/www|/var/lib/ottm|127\.0\.0\.1:3000|127\.0\.0\.1:3080)' "$conf"; then
            echo "mẫu nginx còn TLS/giá trị mẫu sau khi thay — ký hiệu cho CI trong nginx.conf.example đã đổi?"; exit 1
          fi
          grep -q '^[[:space:]]*listen 80;' "$conf"
          grep -q "server 127.0.0.1:$CI_WEB_PORT;" "$conf"
          docker run --rm -v "$conf:/etc/nginx/conf.d/default.conf:ro" "$NGINX_IMAGE" nginx -t
      - name: nginx -t mẫu chế độ tách deploy/nginx-api.conf.example (host api, cổng 8081, không TLS) — riêng và song song mẫu cùng VPS
        run: |
          conf="$RUNNER_TEMP/nginx/ottm-api.conf"
          sed -e '/^# >>> REDIRECT-80$/,/^# <<< REDIRECT-80$/d' \
              -e '/^[[:space:]]*ssl_/d' \
              -e '/^[[:space:]]*listen \[::\]:443/d' \
              -e 's/^\([[:space:]]*\)listen 443 ssl http2;/\1listen 8081;/' \
              -e 's/api\.example\.com/localhost/g' \
              -e 's/app\.example\.com/localhost:5173/g' \
              -e "s/127\.0\.0\.1:3000;/127.0.0.1:$CI_API_PORT;/" \
              nginx-api.conf.example > "$conf"
          if grep -nE '^[^#]*(location[^{]*/media|alias)' "$conf"; then echo "mẫu nginx-api còn phục vụ /media"; exit 1; fi
          if grep -nE '^[^#]*(ssl|443|example\.com|/var/lib/ottm|127\.0\.0\.1:3000)' "$conf"; then
            echo "mẫu nginx-api còn TLS/giá trị mẫu sau khi thay — ký hiệu cho CI đã đổi?"; exit 1
          fi
          grep -q '^[[:space:]]*listen 8081;' "$conf"
          # Kiểm riêng và kiểm cùng mẫu cùng VPS (tên map/upstream/zone không trùng → cài song song được).
          docker run --rm -v "$conf:/etc/nginx/conf.d/default.conf:ro" "$NGINX_IMAGE" nginx -t
          docker run --rm -v "$conf:/etc/nginx/conf.d/api.conf:ro" -v "$RUNNER_TEMP/nginx/ottm.conf:/etc/nginx/conf.d/default.conf:ro" \
            "$NGINX_IMAGE" nginx -t
      - name: Build image production (ottm-server, ottm-web)
        run: docker compose --profile web build
      - name: Build ottm-web với VITE_API_ORIGIN (web và api hai tên miền)
        run: |
          VITE_API_ORIGIN=https://api.ottm-ci.example.test IMAGE_TAG=ci-split docker compose --profile web build web
          docker run --rm --entrypoint sh ottm-web:ci-split -c 'grep -rl "api.ottm-ci.example.test" /usr/share/nginx/html/assets >/dev/null'
          docker image rm ottm-web:ci-split
      - name: media:check chạy được trong image api (chưa cấu hình Cloudinary → báo thiếu CLOUDINARY_URL, exit 1)
        run: |
          set +e; out="$(docker compose run --rm -T --no-deps api npm run media:check 2>&1)"; code=$?; set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "chưa đặt CLOUDINARY_URL" <<<"$out"
      - name: Log khi lỗi
        if: failure()
        run: docker compose --profile web logs --tail=200
      - name: Dọn
        if: always()
        run: docker compose --profile web down -v --remove-orphans
